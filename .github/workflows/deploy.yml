name: Deploy Portfolio Site

on:
  push:
    branches:
      - main
      - prod
      - deploy  

permissions:
  pages: write
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: . 

      - name: Deploy
        uses: actions/deploy-pages@v4